name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Bash fixtures and syntax
        run: |
          bash tests/drm-selection.sh
          bash tests/slideshow.sh
          bash tests/start-photoframe.sh
          for file in *.sh scripts/*.sh tests/*.sh; do bash -n "$file" || exit; done
      - name: Build image
        run: docker build -t photoframe-test .
      - name: Verify local photos and settings are excluded from the build
        run: |
          mkdir -p photos other-photos
          touch .env photos/sample.jpg other-photos/sample.jpg
          docker build --file - . <<'EOF'
          FROM ubuntu:24.04
          COPY . /context
          RUN test -f /context/entrypoint.sh \
              && test ! -e /context/.env \
              && test ! -e /context/.git \
              && test ! -e /context/photos \
              && test ! -e /context/other-photos
          EOF
      - name: Reject a missing photo directory
        env:
          COMPOSE_PROJECT_NAME: photoframe-mount-test
          DRM_DEVICE: /dev/null
        run: |
          root=$(mktemp -d)
          trap 'docker compose down; rmdir "$root"' EXIT
          export PHOTO_DIR="$root/missing photos"
          docker tag photoframe-test photoframe-mount-test-photoframe
          if output=$(docker compose run --rm --entrypoint /bin/true photoframe 2>&1); then
            echo "Compose accepted a missing PHOTO_DIR" >&2
            exit 1
          fi
          printf '%s\n' "$output" | grep -F 'bind source path does not exist'
          test ! -e "$PHOTO_DIR"
      - name: Reject a device without KMS
        run: |
          if output=$(docker run --rm --entrypoint /usr/local/bin/drm-probe photoframe-test /dev/null 2>&1); then
            echo "The probe accepted a non-DRM device" >&2
            exit 1
          fi
          printf '%s\n' "$output" | grep -F 'Cannot query KMS resources for /dev/null:'
